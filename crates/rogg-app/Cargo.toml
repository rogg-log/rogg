[package]
name = "rogg-app"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "rogg_app"
path = "src/lib.rs"

[[bin]]
name = "rogg"
path = "src/main.rs"

[dependencies]
rogg-core = { path = "../rogg-core" }
rogg-ui = { path = "../rogg-ui" }
gpui-kit.workspace = true
anyhow.workspace = true
ureq.workspace = true

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
rogg-genlog = { path = "../rogg-genlog" }
sha2.workspace = true

# Only the Unix FIFO test (`tests/streams.rs`) uses it.
[target.'cfg(unix)'.dev-dependencies]
libc.workspace = true

[build-dependencies]
# Compiles rogg.exe's icon and version resources on Windows targets (build.rs).
embed-resource = "3.0.12"
