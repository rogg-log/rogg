[workspace]
resolver = "3"
members = ["crates/rogg-ui", "crates/rogg-gallery"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
gpui-kit = "=0.7.1"
rust-embed = { version = "8.7.2", features = ["include-exclude"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
