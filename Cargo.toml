[workspace]
resolver = "3"
members = ["crates/rogg-ui", "crates/rogg-gallery", "crates/rogg-core", "crates/rogg-genlog", "crates/rogg-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
gpui-kit = "=0.7.1"
rust-embed = { version = "8.7.2", features = ["include-exclude"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
memmap2 = "=0.9.11"
memchr = "=2.8.3"
regex = "=1.13.1"
aho-corasick = "=1.1.5"
rayon = "=1.12.0"
encoding_rs = "=0.8.42"
thiserror = "=2.0.21"
proptest = "=1.11.0"
criterion = "=0.8.2"
tempfile = "=3.27.0"
